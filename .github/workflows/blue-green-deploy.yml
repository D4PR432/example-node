name: Blue-Green CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  blue-green-deploy:
    name: Blue-Green Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Blue-Green via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Leer el estado actual
            source /etc/nginx/current_deploy.env
            echo "Color actual: $CURRENT_COLOR"

            # Determinar el color opuesto
            if [ "$CURRENT_COLOR" == "Blue" ]; then
              TARGET_COLOR="Green"
              APP_TARGET_IP="192.168.1.20"
              APP_TARGET_PORT="8081"
            else
              TARGET_COLOR="Blue"
              APP_TARGET_IP="192.168.1.10"
              APP_TARGET_PORT="8080"
            fi

            echo "Desplegando en: $TARGET_COLOR"

            # Exportar variables para envsubst
            export APP_TARGET_IP=$APP_TARGET_IP
            export APP_TARGET_PORT=$APP_TARGET_PORT
            export DEPLOYMENT_COLOR=$TARGET_COLOR

            # Usar envsubst para generar la configuración
            envsubst '${APP_TARGET_IP} ${APP_TARGET_PORT} ${DEPLOYMENT_COLOR}' \
              < /root/blue-green/nginx.conf.template \
              > /etc/nginx/conf.d/default.conf

            # Validar y recargar Nginx
            nginx -t && systemctl reload nginx

            # Actualizar el archivo de estado
            echo "CURRENT_COLOR=$TARGET_COLOR" > /etc/nginx/current_deploy.env
            echo "Despliegue exitoso - Ambiente activo: $TARGET_COLOR"
